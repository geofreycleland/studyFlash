<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AWS SAA-C03 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #f5f0e8;
    --surface:    #fdfaf4;
    --surface2:   #f0e9d8;
    --border:     #d4c9b0;
    --border2:    #c2b49a;

    --rust:       #c0572a;
    --rust-light: #f0ddd4;
    --sage:       #5a7a5e;
    --sage-light: #d8e8d8;
    --amber:      #d4900a;
    --amber-light:#faecd0;

    --ink:        #2c2418;
    --ink2:       #6b5d48;
    --ink3:       #a0907a;

    --serif:      'Lora', Georgia, serif;
    --mono:       'DM Mono', 'Courier New', monospace;
    --radius:     10px;
    --radius-sm:  6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 20% 80%, rgba(192,87,42,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(90,122,94,0.06) 0%, transparent 50%);
  }

  /* ── Top bar ── */
  .topbar {
    padding: 16px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
  }

  .topbar-left { display: flex; flex-direction: column; gap: 2px; }

  .topbar-title {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--rust);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .topbar-sub {
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: var(--ink2);
  }

  .card-counter {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink3);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
  }

  /* ── Progress ── */
  .progress-wrap {
    padding: 12px 20px;
    flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .progress-bar-bg {
    height: 5px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rust), var(--amber));
    border-radius: 99px;
    transition: width 0.5s ease;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
  }

  .progress-meta span {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink3);
  }

  /* ── Domain tabs ── */
  .domain-tabs {
    display: flex;
    gap: 4px;
    padding: 10px 20px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .domain-tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink3);
    background: var(--surface);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }

  .tab.active {
    background: var(--rust);
    border-color: var(--rust);
    color: #fff;
  }

  .tab.coming-soon { opacity: 0.4; cursor: not-allowed; }

  /* ── Card area ── */
  .card-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 0;
    justify-content: center;
    min-height: 0;
  }

  .card-scene {
    perspective: 1200px;
    margin-bottom: 14px;
  }

  .flashcard {
    width: 100%;
    min-height: 256px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }

  .flashcard.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%;
    min-height: 256px;
    border-radius: var(--radius);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    padding: 22px;
    display: flex;
    flex-direction: column;
  }

  /* Front — clean warm paper */
  .card-front {
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(44,36,24,0.08), 0 1px 3px rgba(44,36,24,0.06);
  }

  /* Ruled lines effect */
  .card-front::before {
    content: '';
    position: absolute;
    inset: 22px 22px 22px 22px;
    background: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 27px,
      var(--border) 27px,
      var(--border) 28px
    );
    pointer-events: none;
    opacity: 0.35;
    border-radius: 2px;
  }

  /* Back — warm terracotta tint */
  .card-back {
    background: linear-gradient(145deg, #f7ede0, #f0e2cc);
    border: 1px solid var(--border2);
    transform: rotateY(180deg);
    box-shadow: 0 2px 12px rgba(44,36,24,0.1), 0 1px 3px rgba(44,36,24,0.06);
    position: absolute;
  }

  .card-back::after {
    content: '';
    position: absolute;
    left: 22px;
    top: 0; bottom: 0;
    width: 1px;
    background: rgba(192,87,42,0.2);
  }

  .card-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 14px;
    position: relative;
    z-index: 1;
  }

  .chip-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border2);
    flex-shrink: 0;
  }

  .card-back .chip-dot { background: var(--rust); }
  .card-back .card-chip { color: var(--rust); }

  .card-def {
    font-family: var(--serif);
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--ink);
    flex: 1;
    position: relative;
    z-index: 1;
  }

  .card-hint {
    margin-top: 14px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 12px;
    color: var(--ink3);
    position: relative;
    z-index: 1;
  }

  .card-answer {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: 8px;
    flex: 1;
    display: flex;
    align-items: center;
    position: relative;
    z-index: 1;
    padding-left: 18px;
  }

  .card-category-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: var(--radius-sm);
    background: var(--rust-light);
    color: var(--rust);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 14px;
    position: relative;
    z-index: 1;
    margin-left: 18px;
  }

  /* ── Action buttons ── */
  .actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    padding-bottom: 24px;
  }

  .actions.hidden { visibility: hidden; pointer-events: none; }

  .btn {
    flex: 1;
    padding: 13px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    font-family: var(--serif);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: var(--surface);
    color: var(--ink2);
    transition: all 0.15s;
  }

  .btn:active { transform: translateY(1px); }
  .btn-icon { font-size: 17px; line-height: 1; }

  .btn-know {
    background: var(--sage-light);
    border-color: var(--sage);
    color: var(--sage);
  }

  .btn-retry {
    background: var(--rust-light);
    border-color: var(--rust);
    color: var(--rust);
  }

  .btn-flip {
    background: var(--surface2);
    border-color: var(--border2);
    color: var(--ink2);
  }

  /* ── Done screen ── */
  .done-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    flex: 1;
  }

  .done-screen.visible { display: flex; }

  .done-icon { font-size: 44px; margin-bottom: 16px; }

  .done-title {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .done-sub {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    color: var(--ink2);
    line-height: 1.65;
    max-width: 280px;
    margin: 0 auto 28px;
  }

  .stats-row { display: flex; gap: 10px; margin-bottom: 28px; }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 20px;
    min-width: 80px;
    border-top: 3px solid var(--rust);
  }

  .stat-num {
    font-family: var(--mono);
    font-size: 28px;
    color: var(--ink);
    line-height: 1;
  }

  .stat-lbl {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink3);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .btn-restart {
    padding: 13px 32px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--rust);
    background: var(--rust);
    color: #fff;
    font-family: var(--serif);
    font-size: 15px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }

  .btn-restart:hover { background: #a84820; border-color: #a84820; }
  .btn-restart:active { transform: translateY(1px); }

  /* Retry badge */
  .retry-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--amber);
    margin-left: auto;
  }

  .retry-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--amber);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-title">AWS SAA-C03</span>
    <span class="topbar-sub">Flashcard Deck</span>
  </div>
  <span class="card-counter" id="cardCounter">— / —</span>
</div>

<div class="progress-wrap">
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-meta">
    <span id="progressKnown">0 known</span>
    <span id="retryBadge" style="display:none">
      <span class="retry-dot"></span> <span id="retryCount">0</span> to retry
    </span>
  </div>
</div>

<div class="domain-tabs">
  <button class="tab active" onclick="selectDomain(0)">Domain 1 — Secure</button>
  <button class="tab coming-soon" title="Coming soon">Domain 2 — Resilient</button>
  <button class="tab coming-soon" title="Coming soon">Domain 3 — High Perf</button>
  <button class="tab coming-soon" title="Coming soon">Domain 4 — Cost Opt</button>
</div>

<div class="card-area" id="quizArea">
  <div class="card-scene">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="card-face card-front">
        <div class="card-chip"><span class="chip-dot"></span>Definition</div>
        <div class="card-def" id="defText"></div>
        <div class="card-hint">Tap to reveal the answer →</div>
      </div>
      <div class="card-face card-back">
        <div class="card-chip"><span class="chip-dot"></span>Answer</div>
        <div class="card-category-tag" id="categoryText"></div>
        <div class="card-answer" id="answerText"></div>
      </div>
    </div>
  </div>

  <div class="actions hidden" id="actions">
    <button class="btn btn-retry" onclick="dontKnow()">
      <span class="btn-icon">↩</span>
      <span>Try again</span>
    </button>
    <button class="btn btn-flip" onclick="flipCard()">
      <span class="btn-icon">⟳</span>
      <span>Flip</span>
    </button>
    <button class="btn btn-know" onclick="gotIt()">
      <span class="btn-icon">✓</span>
      <span>Got it</span>
    </button>
  </div>

  <div class="actions" id="preFlipActions" style="visibility:visible">
    <button class="btn btn-flip" style="flex:1" onclick="flipCard()">
      <span class="btn-icon">⟳</span>
      <span>Tap card or click to reveal</span>
    </button>
  </div>
</div>

<div class="done-screen" id="doneScreen">
  <div class="done-icon">🎉</div>
  <div class="done-title" id="doneTitle">Deck complete!</div>
  <div class="done-sub" id="doneSub"></div>
  <div class="stats-row">
    <div class="stat"><div class="stat-num" id="statKnown">0</div><div class="stat-lbl">Known</div></div>
    <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-num" id="statPasses">0</div><div class="stat-lbl">Passes</div></div>
  </div>
  <button class="btn-restart" onclick="restart()">Start over</button>
</div>

<script>
const allDecks = [
  // Domain 1 — Design Secure Architectures
  [
    { answer: "AWS Site-to-Site VPN", category: "Networking & Access Control", def: "Creates an encrypted IPsec tunnel between your on-premises network and your Amazon VPC over the public internet, enabling secure hybrid connectivity that is fast to deploy." },
    { answer: "Application Load Balancer (ALB)", category: "Networking & Access Control", def: "A load balancer that operates at the request level (Layer 7), routing HTTP and HTTPS traffic to targets such as EC2 instances, containers, and Lambda functions based on request content." },
    { answer: "NAT Gateway", category: "Networking & Access Control", def: "A managed, highly available Network Address Translation service that enables instances in a private subnet to initiate outbound traffic to the internet while preventing inbound connections from the internet." },

    { answer: "VPC Gateway Endpoint", category: "Networking & Access Control", def: "A gateway you specify in your route table to allow private communication between your VPC and supported AWS services (S3 and DynamoDB) without requiring an internet gateway or NAT device." },
    { answer: "VPC Interface Endpoint", category: "Networking & Access Control", def: "An elastic network interface with a private IP address that serves as an entry point for traffic destined to a supported AWS service, powered by AWS PrivateLink — keeping traffic off the public internet." },
    { answer: "AWS WAF", category: "Networking & Access Control", def: "A web application firewall that helps protect your web applications or APIs against common web exploits and bots that may affect availability, compromise security, or consume excessive resources." },
    { answer: "AWS Global Accelerator", category: "Networking & Access Control", def: "A networking service that uses the AWS global network to route traffic to optimal regional endpoints, providing two static anycast IP addresses and improving availability and performance for global users." },
    { answer: "Network Load Balancer (NLB)", category: "Networking & Access Control", def: "A load balancer that operates at the connection level (Layer 4), routing TCP, UDP, and TLS traffic to targets with ultra-low latency — capable of handling millions of requests per second." },
    { answer: "AWS VPC Lattice", category: "Networking & Access Control", def: "A fully managed application networking service that simplifies service-to-service connectivity, security, and monitoring across VPCs and accounts, with built-in support for HTTPS listeners and service discovery." },
    { answer: "AWS PrivateLink", category: "Networking & Access Control", def: "A technology that provides private connectivity between VPCs and AWS services or your own services, keeping all traffic on the Amazon network without exposing it to the public internet." },
    { answer: "Network ACL (NACL)", category: "Networking & Access Control", def: "An optional, stateless layer of security for your VPC that acts as a firewall for controlling traffic in and out of one or more subnets. Rules are evaluated in number order and allow or deny traffic explicitly." },

    { answer: "AWS CloudFormation", category: "Other", def: "A service that lets you model, provision, and manage AWS and third-party resources by treating infrastructure as code, allowing you to create repeatable, consistent stacks from a single template." },

let activeDeck = 0;
let deck = [];
let retryPile = [];
let knownCount = 0;
let passCount = 1;
let current = null;
let flipped = false;
let revealed = false;
let totalCards = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function selectDomain(idx) {
  if (idx !== 0) return;
  activeDeck = idx;
  document.querySelectorAll('.tab').forEach((t, i) => {
    if (!t.classList.contains('coming-soon')) t.classList.toggle('active', i === idx);
  });
  restart();
}

function init() {
  totalCards = allDecks[activeDeck].length;
  deck = shuffle(allDecks[activeDeck]);
  retryPile = [];
  knownCount = 0;
  passCount = 1;
  document.getElementById('quizArea').style.display = 'flex';
  document.getElementById('doneScreen').classList.remove('visible');
  showCard();
  updateProgress();
}

function showCard() {
  if (deck.length === 0 && retryPile.length === 0) { showDone(); return; }
  if (deck.length === 0) {
    passCount++;
    deck = shuffle([...retryPile]);
    retryPile = [];
  }
  current = deck[0];
  flipped = false;
  revealed = false;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('defText').textContent = current.def;
  document.getElementById('answerText').textContent = current.answer;
  document.getElementById('categoryText').textContent = current.category;
  document.getElementById('actions').classList.add('hidden');
  document.getElementById('preFlipActions').style.visibility = 'visible';
  updateProgress();
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('flashcard').classList.toggle('flipped', flipped);
  if (flipped && !revealed) {
    revealed = true;
    document.getElementById('actions').classList.remove('hidden');
    document.getElementById('preFlipActions').style.visibility = 'hidden';
  }
  if (!flipped && revealed) {
    document.getElementById('preFlipActions').style.visibility = 'hidden';
  }
}

function gotIt() {
  deck.shift();
  knownCount++;
  showCard();
}

function dontKnow() {
  retryPile.push(deck.shift());
  showCard();
}

function updateProgress() {
  const pct = totalCards > 0 ? Math.round((knownCount / totalCards) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressKnown').textContent = knownCount + ' of ' + totalCards + ' known';

  const retryCount = retryPile.length;
  const retryEl = document.getElementById('retryBadge');
  if (retryCount > 0) {
    retryEl.style.display = 'flex';
    document.getElementById('retryCount').textContent = retryCount;
  } else {
    retryEl.style.display = 'none';
  }

  const remaining = deck.length + retryPile.length;
  const cardNum = totalCards - remaining + 1;
  document.getElementById('cardCounter').textContent = 'Card ' + Math.min(cardNum, totalCards) + ' / ' + totalCards;
}

function showDone() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('doneScreen').classList.add('visible');
  document.getElementById('statKnown').textContent = knownCount;
  document.getElementById('statTotal').textContent = totalCards;
  document.getElementById('statPasses').textContent = passCount;
  const perfect = knownCount === totalCards;
  document.getElementById('doneTitle').textContent = perfect ? 'Perfect score!' : 'Deck complete!';
  document.getElementById('doneSub').textContent = perfect
    ? 'You knew every card on this domain. Add Domain 2 when ready!'
    : 'Keep going — you can restart and the cards you missed will come back around.';
}

function restart() { init(); }

init();
</script>

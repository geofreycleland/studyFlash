<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AWS SAA-C03 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #f5f0e8;
    --surface:    #fdfaf4;
    --surface2:   #f0e9d8;
    --border:     #d4c9b0;
    --border2:    #c2b49a;

    --rust:       #c0572a;
    --rust-light: #f0ddd4;
    --sage:       #5a7a5e;
    --sage-light: #d8e8d8;
    --amber:      #d4900a;
    --amber-light:#faecd0;
    --indigo:     #4a5fa8;
    --indigo-light: #dde3f7;

    --tier1-color:  #c0572a;
    --tier1-bg:     #f0ddd4;
    --tier1-border: #c0572a;
    --tier2-color:  #d4900a;
    --tier2-bg:     #faecd0;
    --tier2-border: #d4900a;
    --tier3-color:  #5a7a5e;
    --tier3-bg:     #d8e8d8;
    --tier3-border: #5a7a5e;

    --ink:        #2c2418;
    --ink2:       #6b5d48;
    --ink3:       #a0907a;

    --serif:      'Lora', Georgia, serif;
    --mono:       'DM Mono', 'Courier New', monospace;
    --radius:     10px;
    --radius-sm:  6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 20% 80%, rgba(192,87,42,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(90,122,94,0.06) 0%, transparent 50%);
  }

  /* ── Top bar ── */
  .topbar {
    padding: 14px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
  }
  .topbar-left { display: flex; flex-direction: column; gap: 2px; }
  .topbar-title {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    color: var(--rust); letter-spacing: 0.12em; text-transform: uppercase;
  }
  .topbar-sub { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--ink2); }
  .card-counter {
    font-family: var(--mono); font-size: 12px; color: var(--ink3);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 3px 10px;
  }

  /* ── Progress ── */
  .progress-wrap {
    padding: 10px 20px;
    flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .progress-bar-bg {
    height: 5px; background: var(--surface2); border-radius: 99px;
    overflow: hidden; border: 1px solid var(--border);
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rust), var(--amber));
    border-radius: 99px; transition: width 0.5s ease;
  }
  .progress-meta { display: flex; justify-content: space-between; margin-top: 5px; }
  .progress-meta span { font-family: var(--mono); font-size: 11px; color: var(--ink3); }

  /* ── Tier tabs ── */
  .tier-tabs {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    flex-shrink: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .tier-tab {
    flex: 1;
    padding: 7px 4px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border2);
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink3);
    background: var(--surface);
    cursor: pointer;
    text-align: center;
    line-height: 1.4;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .tier-tab .tier-label { display: block; font-size: 9px; opacity: 0.75; margin-top: 2px; }
  .tier-tab.active-tier1 { background: var(--tier1-bg); border-color: var(--tier1-border); color: var(--tier1-color); }
  .tier-tab.active-tier2 { background: var(--tier2-bg); border-color: var(--tier2-border); color: var(--tier2-color); }
  .tier-tab.active-tier3 { background: var(--tier3-bg); border-color: var(--tier3-border); color: var(--tier3-color); }

  /* ── Card area ── */
  .card-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 18px 20px 0;
    justify-content: center;
    min-height: 0;
  }

  .card-scene {
    -webkit-perspective: 1200px;
    perspective: 1200px;
    margin-bottom: 14px;
  }

  .flashcard {
    width: 100%;
    min-height: 270px;
    position: relative;
    -webkit-transform-style: preserve-3d;
    transform-style: preserve-3d;
    -webkit-transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .flashcard.flipped { -webkit-transform: rotateY(180deg); transform: rotateY(180deg); }
  .flashcard.flipped .card-front { visibility: hidden; }
  .flashcard:not(.flipped) .card-back { visibility: hidden; }

  .card-face {
    position: absolute;
    width: 100%;
    min-height: 270px;
    border-radius: var(--radius);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    -webkit-transform: translateZ(0);
  }

  .card-front {
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(44,36,24,0.08), 0 1px 3px rgba(44,36,24,0.06);
  }


  .card-back {
    background: linear-gradient(145deg, #f7ede0, #f0e2cc);
    border: 1px solid var(--border2);
    -webkit-transform: rotateY(180deg);
    transform: rotateY(180deg);
    box-shadow: 0 2px 12px rgba(44,36,24,0.1), 0 1px 3px rgba(44,36,24,0.06);
    position: absolute;
  }
  .card-back::after {
    content: ''; position: absolute; left: 22px;
    top: 0; bottom: 0; width: 1px; background: rgba(192,87,42,0.2);
  }

  .card-chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 10px; color: var(--ink3);
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 12px; position: relative; z-index: 1;
  }
  .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
  .card-back .card-chip { color: var(--rust); }
  .card-back .chip-dot { background: var(--rust); }

  .card-def {
    font-family: var(--serif); font-size: 14px; line-height: 1.75;
    color: var(--ink); flex: 1; position: relative; z-index: 1;
  }
  .card-hint {
    margin-top: 12px; font-family: var(--serif); font-style: italic;
    font-size: 12px; color: var(--ink3); position: relative; z-index: 1;
  }

  /* Tier badge on front */
  .tier-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 20px;
    font-family: var(--mono); font-size: 9px;
    letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 10px; position: relative; z-index: 1;
    align-self: flex-start;
  }
  .tier-badge.t1 { background: var(--tier1-bg); color: var(--tier1-color); border: 1px solid var(--tier1-border); }
  .tier-badge.t2 { background: var(--tier2-bg); color: var(--tier2-color); border: 1px solid var(--tier2-border); }
  .tier-badge.t3 { background: var(--tier3-bg); color: var(--tier3-color); border: 1px solid var(--tier3-border); }

  /* Back answer */
  .card-answer {
    font-family: var(--serif); font-size: 22px; font-weight: 600;
    color: var(--ink); line-height: 1.3; margin-bottom: 6px;
    position: relative; z-index: 1; padding-left: 18px;
  }
  .card-category-tag {
    display: inline-block; padding: 2px 9px; border-radius: var(--radius-sm);
    background: var(--rust-light); color: var(--rust);
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 10px;
    position: relative; z-index: 1; margin-left: 18px;
  }
  .card-memory {
    margin-left: 18px; margin-top: 8px;
    padding: 8px 12px; border-radius: var(--radius-sm);
    background: rgba(192,87,42,0.08); border-left: 2px solid var(--rust);
    font-family: var(--mono); font-size: 11px; color: var(--ink2);
    line-height: 1.55; position: relative; z-index: 1;
  }
  .card-memory-label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--rust); margin-bottom: 3px; display: block;
  }

  /* ── Actions ── */
  .actions { display: flex; gap: 8px; flex-shrink: 0; padding-bottom: 20px; }
  .actions.hidden { visibility: hidden; pointer-events: none; }
  .btn {
    flex: 1; padding: 12px 8px; border-radius: var(--radius-sm);
    border: 1px solid var(--border2); font-family: var(--serif);
    font-size: 13px; cursor: pointer; display: flex;
    flex-direction: column; align-items: center; gap: 4px;
    background: var(--surface); color: var(--ink2); transition: all 0.15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-icon { font-size: 16px; line-height: 1; }
  .btn-know { background: var(--sage-light); border-color: var(--sage); color: var(--sage); }
  .btn-retry { background: var(--rust-light); border-color: var(--rust); color: var(--rust); }
  .btn-flip { background: var(--surface2); border-color: var(--border2); color: var(--ink2); }

  /* ── Done screen ── */
  .done-screen {
    display: none; flex-direction: column; align-items: center;
    justify-content: center; padding: 40px 24px; text-align: center; flex: 1;
  }
  .done-screen.visible { display: flex; }
  .done-icon { font-size: 44px; margin-bottom: 16px; }
  .done-title { font-family: var(--serif); font-size: 24px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
  .done-sub { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ink2); line-height: 1.65; max-width: 280px; margin: 0 auto 24px; }
  .stats-row { display: flex; gap: 10px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 18px; min-width: 72px; border-top: 3px solid var(--rust); }
  .stat-num { font-family: var(--mono); font-size: 26px; color: var(--ink); line-height: 1; }
  .stat-lbl { font-family: var(--mono); font-size: 10px; color: var(--ink3); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.08em; }
  .btn-restart {
    padding: 12px 28px; border-radius: var(--radius-sm);
    border: 1px solid var(--rust); background: var(--rust);
    color: #fff; font-family: var(--serif); font-size: 15px;
    cursor: pointer; transition: all 0.15s; letter-spacing: 0.02em;
  }
  .btn-restart:hover { background: #a84820; }
  .btn-restart:active { transform: translateY(1px); }

  .retry-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); display: inline-block; margin-right: 4px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-title">AWS SAA-C03</span>
    <span class="topbar-sub">Flashcard Deck</span>
  </div>
  <span class="card-counter" id="cardCounter">— / —</span>
</div>

<div class="progress-wrap">
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-meta">
    <span id="progressKnown">0 known</span>
    <span id="retryBadge" style="display:none">
      <span class="retry-dot"></span><span id="retryCount">0</span> to retry
    </span>
  </div>
</div>

<div class="tier-tabs">
  <button class="tier-tab active-tier1" id="tab0" onclick="selectTier(0)">
    🔥 Must Know
    <span class="tier-label">Cold</span>
  </button>
  <button class="tier-tab" id="tab1" onclick="selectTier(1)">
    ⚡ Know Well
    <span class="tier-label">Medium</span>
  </button>
  <button class="tier-tab" id="tab2" onclick="selectTier(2)">
    🌿 Nice to Know
    <span class="tier-label">Lower freq</span>
  </button>
  <button class="tier-tab" id="tab3" onclick="selectTier(3)">
    🃏 All Cards
    <span class="tier-label">Full deck</span>
  </button>
</div>

<div class="card-area" id="quizArea">
  <div class="card-scene">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="card-face card-front">
        <div class="tier-badge t1" id="tierBadgeEl">🔥 Must Know</div>
        <div class="card-chip"><span class="chip-dot"></span>Definition</div>
        <div class="card-def" id="defText"></div>
        <div class="card-hint">Tap to reveal the answer →</div>
      </div>
      <div class="card-face card-back">
        <div class="card-chip"><span class="chip-dot"></span>Answer</div>
        <div class="card-category-tag" id="categoryText"></div>
        <div class="card-answer" id="answerText"></div>
        <div class="card-memory">
          <span class="card-memory-label">💡 Remember it</span>
          <span id="memoryText"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="actions hidden" id="actions">
    <button class="btn btn-retry" onclick="dontKnow()">
      <span class="btn-icon">↩</span><span>Try again</span>
    </button>
    <button class="btn btn-flip" onclick="flipCard()">
      <span class="btn-icon">⟳</span><span>Flip</span>
    </button>
    <button class="btn btn-know" onclick="gotIt()">
      <span class="btn-icon">✓</span><span>Got it</span>
    </button>
  </div>

  <div class="actions" id="preFlipActions" style="visibility:visible">
    <button class="btn btn-flip" style="flex:1" onclick="flipCard()">
      <span class="btn-icon">⟳</span><span>Tap card or click to reveal</span>
    </button>
  </div>
</div>

<div class="done-screen" id="doneScreen">
  <div class="done-icon">🎉</div>
  <div class="done-title" id="doneTitle">Deck complete!</div>
  <div class="done-sub" id="doneSub"></div>
  <div class="stats-row">
    <div class="stat"><div class="stat-num" id="statKnown">0</div><div class="stat-lbl">Known</div></div>
    <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-num" id="statPasses">0</div><div class="stat-lbl">Passes</div></div>
  </div>
  <button class="btn-restart" onclick="restart()">Start over</button>
</div>

<script>
// tier: 1=Must Know, 2=Know Well, 3=Nice to Know
const ALL_CARDS = [

  // ── TIER 1: MUST KNOW COLD ──────────────────────────────────────────────
  { tier: 1, answer: "Amazon VPC", category: "Networking",
    def: "A logically isolated section of the AWS Cloud where you can launch resources in a virtual network you define — with full control over IP ranges, subnets, route tables, and gateways.",
    memory: "VPC = your private walled city inside AWS. You control the roads (routes), gates (gateways), and walls (security groups/NACLs)." },

  { tier: 1, answer: "Security Groups", category: "Networking",
    def: "A stateful virtual firewall controlling inbound and outbound traffic at the instance level. All rules are evaluated before deciding — and return traffic is automatically allowed.",
    memory: "Stateful = remembers the conversation. If you let traffic IN, the reply gets OUT automatically. Operates at the instance level." },

  { tier: 1, answer: "Network ACL (NACL)", category: "Networking",
    def: "An optional, stateless layer of security for your VPC that acts as a firewall at the subnet level. Rules are evaluated in number order; you must explicitly allow both inbound AND outbound.",
    memory: "Stateless = goldfish memory. Every packet is judged independently. Subnet-level, rules in order — add 100, 200, etc." },

  { tier: 1, answer: "AWS IAM", category: "Identity & Access",
    def: "Manages who is authenticated and authorized to use AWS resources. Uses users, groups, roles, and policies. Free service, global scope.",
    memory: "IAM = the bouncer + guest list for all of AWS. Roles = temporary ID badges. Policies = the rulebook." },

  { tier: 1, answer: "IAM Roles", category: "Identity & Access",
    def: "An IAM identity with specific permissions that can be assumed by AWS services, users, or external identities — providing temporary credentials without embedding long-term access keys.",
    memory: "Roles = costume, not permanent identity. EC2 assumes a role; it gets a temporary badge that expires. No hardcoded keys needed." },

  { tier: 1, answer: "Amazon S3", category: "Storage",
    def: "Object storage service with industry-leading scalability. Stores any amount of data with 99.999999999% (11 9s) durability. Features: versioning, lifecycle policies, fine-grained access control, replication.",
    memory: "S3 = infinite filing cabinet in the cloud. 11 nines durability. Think buckets + objects, not folders + files." },

  { tier: 1, answer: "S3 Storage Classes", category: "Storage",
    def: "Tiers for cost optimization: Standard (frequent access), Standard-IA (infrequent, retrieval fee), One Zone-IA (single AZ), Glacier Instant (ms retrieval), Glacier Flexible (minutes–hours), Glacier Deep Archive (hours, cheapest), Intelligent-Tiering (auto).",
    memory: "Hot→Warm→Cold→Frozen. More waiting = cheaper. Glacier = frozen archive. Deep Archive = buried in a bunker." },

  { tier: 1, answer: "Amazon EC2", category: "Compute",
    def: "Resizable virtual compute capacity in the cloud. Full OS control, broad instance type selection. Pay only for what you use. Supports On-Demand, Reserved, Spot, and Dedicated purchasing options.",
    memory: "EC2 = virtual computer you rent. On-Demand = pay-as-you-go, Reserved = 1-3 yr contract (up to 72% off), Spot = bid on spare capacity (cheapest but interruptible)." },

  { tier: 1, answer: "Auto Scaling Groups (ASG)", category: "Compute",
    def: "Automatically adds or removes EC2 instances based on demand, health checks, or schedules. Works with load balancers to distribute traffic across the scaled fleet.",
    memory: "ASG = rubber band for your fleet. Demand spikes → stretches out. Demand drops → snaps back. Always keep min/max/desired in mind." },

  { tier: 1, answer: "Application Load Balancer (ALB)", category: "Networking",
    def: "Layer 7 (HTTP/HTTPS) load balancer routing traffic to targets based on request content — path, host, headers, query strings. Supports target groups: EC2, ECS, Lambda, IP.",
    memory: "ALB = traffic cop who reads the sign on the truck. /api → backend, /images → media servers. Layer 7 = content-aware." },

  { tier: 1, answer: "AWS Lambda", category: "Compute",
    def: "Serverless compute service that runs code in response to events. No server management. Billed per request and compute time (ms). Max 15-minute execution timeout.",
    memory: "Lambda = run code without owning a server. Event triggers it, it runs, you pay only for those milliseconds. 15 min max." },

  { tier: 1, answer: "Amazon RDS", category: "Database",
    def: "Managed relational database service automating hardware provisioning, patching, and backups. Supports MySQL, PostgreSQL, MariaDB, Oracle, SQL Server, and Aurora. Multi-AZ for HA.",
    memory: "RDS = managed SQL database. AWS handles the boring ops stuff. Multi-AZ = standby replica in another AZ for failover." },

  { tier: 1, answer: "Amazon Aurora", category: "Database",
    def: "MySQL- and PostgreSQL-compatible relational database built for the cloud. Up to 5× MySQL throughput. Storage auto-scales to 128TB. Aurora Serverless for variable workloads.",
    memory: "Aurora = RDS on steroids, designed by AWS. 6 copies of data across 3 AZs. Global Database for cross-region reads." },

  { tier: 1, answer: "Amazon DynamoDB", category: "Database",
    def: "Fully managed, serverless key-value and document NoSQL database. Single-digit millisecond performance at any scale. On-demand or provisioned capacity. Global Tables for multi-region.",
    memory: "DynamoDB = NoSQL speed demon. No complex joins — just fast key lookups at scale. Think: partition key + sort key." },

  { tier: 1, answer: "Amazon CloudFront", category: "Networking",
    def: "Global CDN delivering data, videos, and APIs with low latency via a worldwide network of edge locations. Integrates with S3, ALB, EC2. Supports custom SSL certs and WAF.",
    memory: "CloudFront = worldwide copy machine for your content. User in Tokyo hits an edge, not your US server. Cache = faster + cheaper." },

  { tier: 1, answer: "AWS KMS", category: "Security",
    def: "Managed service to create and control cryptographic keys for encrypting data. Deep integration across AWS services. Supports automatic key rotation and full audit logging via CloudTrail.",
    memory: "KMS = key master. CMK = Customer Master Key. Envelope encryption: data key encrypts data, CMK encrypts the data key." },

  { tier: 1, answer: "AWS IAM Identity Center (SSO)", category: "Identity & Access",
    def: "Central place to manage SSO access to multiple AWS accounts and business applications. Integrates with existing identity sources (AD, Okta, etc.). Replaces legacy AWS SSO.",
    memory: "IAM Identity Center = one login badge to rule all AWS accounts. Connect your company's AD = employees log in with work creds." },

  { tier: 1, answer: "AWS Organizations", category: "Identity & Access",
    def: "Account management service for consolidating multiple AWS accounts. Service Control Policies (SCPs) set maximum permission guardrails across all accounts — they can DENY but not grant permissions.",
    memory: "Organizations = corporate org chart for AWS accounts. SCPs = ceiling on what any account can do, even if the admin tries." },

  { tier: 1, answer: "Amazon Route 53", category: "Networking",
    def: "Highly available and scalable DNS service. Routes end users to internet apps via domain name. Supports routing policies: Simple, Weighted, Latency, Failover, Geolocation, Geoproximity, Multivalue.",
    memory: "Route 53 = global phone book + traffic director. Health checks + failover = automatic rerouting when a region goes down." },

  { tier: 1, answer: "AWS CloudTrail", category: "Security",
    def: "Records all API calls and account activity across your AWS infrastructure — creating a complete audit trail. Logs who did what, from where, and when. Enabled by default (90-day history).",
    memory: "CloudTrail = security camera DVR for your AWS account. Someone deleted an S3 bucket at 2am? CloudTrail has the footage." },

  { tier: 1, answer: "Amazon CloudWatch", category: "Monitoring",
    def: "Monitoring and observability service collecting logs, metrics, and events from AWS resources. Set alarms, create dashboards, trigger automated actions. CloudWatch Logs Insights for querying.",
    memory: "CloudWatch = gauges and dials for your AWS infrastructure. CPU spike → alarm → SNS → Lambda → auto-fix. It's the hub." },

  { tier: 1, answer: "Amazon SQS", category: "Messaging",
    def: "Fully managed message queuing service. Decouples producers and consumers. Standard queue (best-effort ordering, at-least-once) vs FIFO queue (exactly-once, ordered, 300 TPS).",
    memory: "SQS = mailbox between services. Producer drops a message, consumer picks it up later. Decouples = neither side knows the other." },

  { tier: 1, answer: "Amazon SNS", category: "Messaging",
    def: "Fully managed pub/sub messaging service for app-to-app and app-to-person communication. Fan-out pattern: one publish → many subscribers (SQS, Lambda, HTTP, email, SMS).",

const TIER_LABELS = {
  1: { label: '🔥 Must Know', cls: 't1', tabCls: 'active-tier1' },
  2: { label: '⚡ Know Well', cls: 't2', tabCls: 'active-tier2' },
  3: { label: '🌿 Nice to Know', cls: 't3', tabCls: 'active-tier3' },
  0: { label: '🃏 All Cards', cls: 't1', tabCls: 'active-tier1' }
};

let activeTier = 0;
let deck = [];
let retryPile = [];
let knownCount = 0;
let passCount = 1;
let current = null;
let flipped = false;
let revealed = false;
let totalCards = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getCards() {
  if (activeTier === 0) return ALL_CARDS;
  return ALL_CARDS.filter(c => c.tier === activeTier);
}

function selectTier(idx) {
  activeTier = idx;
  [0,1,2,3].forEach(i => {
    const el = document.getElementById('tab' + i);
    el.className = 'tier-tab';
    if (i === idx) {
      const tierNum = idx === 0 ? 0 : idx + 0;
      const cls = idx === 0 ? 'active-tier1' : 'active-tier' + idx;
      el.classList.add(cls);
    }
  });
  restart();
}

function init() {
  const cards = getCards();
  totalCards = cards.length;
  deck = shuffle(cards);
  retryPile = [];
  knownCount = 0;
  passCount = 1;
  document.getElementById('quizArea').style.display = 'flex';
  document.getElementById('doneScreen').classList.remove('visible');
  showCard();
  updateProgress();
}

function showCard() {
  if (deck.length === 0 && retryPile.length === 0) { showDone(); return; }
  if (deck.length === 0) {
    passCount++;
    deck = shuffle([...retryPile]);
    retryPile = [];
  }
  current = deck[0];
  flipped = false;
  revealed = false;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('defText').textContent = current.def;
  document.getElementById('answerText').textContent = current.answer;
  document.getElementById('categoryText').textContent = current.category;
  document.getElementById('memoryText').textContent = current.memory;

  const badge = document.getElementById('tierBadgeEl');
  const tl = TIER_LABELS[current.tier];
  badge.textContent = tl.label;
  badge.className = 'tier-badge ' + tl.cls;

  document.getElementById('actions').classList.add('hidden');
  document.getElementById('preFlipActions').style.visibility = 'visible';
  updateProgress();
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('flashcard').classList.toggle('flipped', flipped);
  if (flipped && !revealed) {
    revealed = true;
    document.getElementById('actions').classList.remove('hidden');
    document.getElementById('preFlipActions').style.visibility = 'hidden';
  }
  if (!flipped && revealed) {
    document.getElementById('preFlipActions').style.visibility = 'hidden';
  }
}

function gotIt() { deck.shift(); knownCount++; showCard(); }
function dontKnow() { retryPile.push(deck.shift()); showCard(); }

function updateProgress() {
  const pct = totalCards > 0 ? Math.round((knownCount / totalCards) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressKnown').textContent = knownCount + ' of ' + totalCards + ' known';
  const rc = retryPile.length;
  const rb = document.getElementById('retryBadge');
  if (rc > 0) { rb.style.display = 'flex'; document.getElementById('retryCount').textContent = rc; }
  else rb.style.display = 'none';
  const remaining = deck.length + retryPile.length;
  const cardNum = totalCards - remaining + 1;
  document.getElementById('cardCounter').textContent = 'Card ' + Math.min(cardNum, totalCards) + ' / ' + totalCards;
}

function showDone() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('doneScreen').classList.add('visible');
  document.getElementById('statKnown').textContent = knownCount;
  document.getElementById('statTotal').textContent = totalCards;
  document.getElementById('statPasses').textContent = passCount;
  const perfect = knownCount === totalCards;
  document.getElementById('doneTitle').textContent = perfect ? 'Perfect score! 🎯' : 'Deck complete!';
  document.getElementById('doneSub').textContent = perfect
    ? 'You knew every card in this tier. Move up to the next tier or try All Cards!'
    : 'Keep going — retry the ones you missed until they stick.';
}

function restart() { init(); }

// init default tab styling
document.getElementById('tab0').classList.add('active-tier1');
init();
</script>
